block.create-teleunit.name=单位传送器
block.create-teleunit.description=在同一电力网络中的同队传送器之间传送单位和玩家。踩上传送器的单位会被传送到下一个同网络传送器，玩家点击可主动传送。需要持续供电。
block.create-teleunit.details=迪里姆合金实现了古代记载中的物质传送特性。

block.create-buffer-pad.name=缓冲机甲台
block.create-buffer-pad.description=生产缓冲机甲单位。玩家踩上后点击切换控制。
block.create-omega-pad.name=欧米伽机甲台
block.create-omega-pad.description=生产欧米伽机甲单位。射击时激活护甲增加防御。
block.create-cache-pad.name=缓存飞行台
block.create-cache-pad.description=生产缓存飞行单位。移动时释放闪电护盾。
block.create-advance-constructor.name=高级构造器
block.create-advance-constructor.description=通过连接高级构造器模块提升等级，解锁并加速建造高级单位。每个模块减少同等级或更高等级单位的建造时间。需要持续供电和材料。
block.create-advance-constructor-module.name=高级构造器模块
block.create-advance-constructor-module.description=链式连接到高级构造器或前一个模块，提升构造器等级以解锁更高 tier 的单位。需要持续供电和低温液体冷却。

