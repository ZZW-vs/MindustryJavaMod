status.create-tpcooldown.name=传送冷却

# 能力
ability.lightning-burst=闪电爆发

# 单位
unit.create-buffer.name=缓冲
unit.create-buffer.description=装备闪电霰弹枪的地面机甲，落地时释放闪电爆发
unit.create-buffer.details=[gray]双臂闪电霰弹枪齐射闪电弹，落地时引发大范围闪电爆发，随后进入长冷却。可随时切换加速模式。[]
unit.create-omega.name=欧米伽
unit.create-omega.description=装备四连发导弹的地面机甲，射击时激活护甲增加防御
unit.create-omega.details=[gray]四联导弹巢齐射造成范围爆炸。交战时激活临时装甲，防御大幅提升但机动力下降，装甲展开时侧翼武器向外偏移。[]
unit.create-cache.name=缓存
unit.create-cache.description=高速飞行单位，移动时释放闪电护盾
unit.create-cache.details=[gray]高速掠过战场时持续释放闪电护盾，电击附近敌军。[]
unit.create-arcnelidia.name=电弧虫
unit.create-arcnelidia.description=带有电弧激光武器的多节飞行单位，由头部和9节段身组成
unit.create-arcnelidia.details=[gray]由头部和多节段身组成。头部装备电弧激光，段身向下投弹。直线冲向目标，越过后再折返，轻微晃动，并持续自我修复。[]

unit.create-toxobyte.name=毒疫虫
unit.create-toxobyte.description=携带瘟疫炮弹和吸附激光的多节飞行单位，由头部和25节段身组成，能够再生新段身
unit.create-toxobyte.details=[gray]由头部和多节段身组成。头部发射吸附激光自我恢复，段身投掷瘟疫炮弹。环绕目标飞行，段身可随时间再生；段身死亡时虫体会分裂，两条虫靠近时又会链式合并。持续自我修复。[]

unit.create-catenapede.name=吸血虫
unit.create-catenapede.description=携带吸血激光和瘟疫导弹的多节飞行单位，由头部和15节段身组成，能够分裂和合并
unit.create-catenapede.details=[gray]由头部和多节段身组成。头部装备吸血激光，命中敌人时回复自身并可拉拽目标，段身投掷瘟疫导弹。环绕目标飞行，段身可再生，支持分裂与链式合并。持续自我修复。[]

unit.create-devourer.name=噬界虫
unit.create-devourer.description=End阵营的超级多节飞行单位，由头部和60节段身组成，全状态免疫，头部发射强大激光，段身配备导弹和激光武器
unit.create-devourer.details=[gray]由头部和众多段身组成的超级巨虫。头部发射强大激光，段身配备导弹与激光武器。全状态免疫，无法再生、分裂或合并，但持续高速自我修复并减免所受伤害。[]

# 正确的 devourer 键名 (代码中实际注册名为 devourer-of-eldrich-gods)
unit.create-devourer-of-eldrich-gods.name=噬界虫
unit.create-devourer-of-eldrich-gods.description=End阵营的超级多节飞行单位，由头部和60节段身组成，全状态免疫，头部发射强大激光，段身配备导弹和激光武器
unit.create-devourer-of-eldrich-gods.details=[gray]由头部和众多段身组成的超级巨虫。头部发射强大激光，段身配备导弹与激光武器。全状态免疫，无法再生、分裂或合并，但持续高速自我修复并减免所受伤害。[]

unit.create-oppression.name=压迫者
unit.create-oppression.description=End阵营的终极多节飞行单位，由头部和55节段身组成，配备主激光、导弹、虚空门户、慢闪电等多种武器，段身间有液压杆连接
unit.create-oppression.details=[gray]头部配备主激光（充能后射击）、导弹、虚空门户（召唤触手）与慢闪电等多种武器，段身间由液压杆连接。释放大招期间移动与旋转大幅减缓但不会完全锁定。环绕目标飞行，持续自我修复并减免所受伤害。[]

unit.create-enigma.name=谜团
unit.create-enigma.description=End阵营飞行单位，装备黑色弹丸武器，具备防作弊能力
unit.create-enigma.details=[gray]武器发射黑色虚空弹丸，弹丸平滑转向追踪目标，并按目标最大生命值比例造成伤害。内置防作弊系统，限制单次与总伤害上限。[]

unit.create-void-vessel.name=虚空容器
unit.create-void-vessel.description=End阵营飞行单位，装备黑色碎裂弹武器，具备护甲削弱能力
unit.create-void-vessel.details=[gray]头部红色大激光充能后发射，两侧小型碎裂弹悬停冲刺后穿透敌阵。可削弱敌方护甲，并内置防作弊系统。[]

unit.create-chronos.name=克罗诺斯
unit.create-chronos.description=End阵营飞行单位，拥有时间停止能力，装备时间停止子弹
unit.create-chronos.details=[gray]充能完毕后引发时间停止，期间以极高频率模拟行动，瞬间完成多次攻击。武器发射时间停止弹。内置防作弊系统。[]

unit.create-opticaecus.name=盲视者
unit.create-opticaecus.description=End阵营飞行单位，装备红色激光和导弹发射器，具备隐身能力
unit.create-opticaecus.details=[gray]头部红色激光可向任意角度发射，两侧导弹以蛇形弹道追踪目标。具备隐身能力与防作弊系统。[]

unit.create-ravager.name=掠夺者
unit.create-ravager.description=End阵营地面单位（8腿），装备噩梦激光、炮弹和小型炮台，具备防作弊能力
unit.create-ravager.details=[gray]多腿行走，每步落地都会震伤周围敌军。装备噩梦激光、闪电炮弹与追踪导弹。免疫所有状态效果，内置防作弊系统。[]

unit.create-exowalker.name=外径行者
unit.create-exowalker.description=Plague阵营地面单位（8腿），装备瘟疫导弹发射器和吸血激光
unit.create-exowalker.details=[gray]多腿行走，瘟疫色涂装。四座瘟疫导弹发射器蛇形追踪目标，吸血激光命中敌人时回复自身。[]

unit.create-toxoswarmer.name=瘟疫蜂群
unit.create-toxoswarmer.description=Plague阵营地面单位（6腿），装备8连发追踪导弹，命中后产生火焰
unit.create-toxoswarmer.details=[gray]多腿行走，瘟疫色涂装。连发追踪导弹蛇形飞行，命中后引发火焰。[]

unit.create-desolation.name=荒芜者
unit.create-desolation.description=End阵营终极地面单位（8腿），装备蓄力主炮、点防激光、触手激光，具备防作弊能力
unit.create-desolation.details=[gray]多腿行走，每步落地震伤周围敌军。装备蓄力主炮、点防激光、副炮、闪电炮与触手激光等多种武器。免疫所有状态效果，内置防作弊系统。[]

# ========== Monolith 巨石系列单位 (PU132 移植) ==========
unit.create-stele.name=石碑
unit.create-stele.description=最基础的巨石地面单位，装备一对简单的能量霰弹枪
unit.create-stele.details=[gray]双臂聚合霰弹枪射出的弹丸会在飞行途中相互吸引聚合，聚合后的伤害如滚雪球般增长。[]
unit.create-pedestal.name=基座
unit.create-pedestal.description=发射大型能量弹，伴随过量的闪电
unit.create-pedestal.details=[gray]侧炮的弹射弹命中后会弹跳向下一个敌人，并伴随生成数道电光；主炮蓄力霰弹齐射前，子弹会环绕装填口盘旋。[]
unit.create-pilaster.name=壁柱
unit.create-pilaster.description=装备两对武器的重型地面单位
unit.create-pilaster.details=[gray]中炮发射激光，大炮的旋转壳弹命中或消散时会爆出持续电击敌人的链电力场，壳弹还拖着数条幻影拖尾。据说这种单位最常用于攻城战。[]
unit.create-pylon.name=塔架
unit.create-pylon.description=巨石超级武器的全新概念：自身发射巨型激光，配合一对小激光武器，可一次摧毁多个实体
unit.create-pylon.details=[gray]主激光威力惊人并伴随闪电辐射，发射前需要架设定身作为代价；副激光高速连射。[]
unit.create-monument.name=纪念碑
unit.create-monument.description=装甲地面单位，装备两对激光武器和一门重型狙击炮
unit.create-monument.details=[gray]两对激光武器持续输出，中轴线的重型电磁炮拥有超远射程，一击贯穿战场。[]
unit.create-colossus.name=巨像
unit.create-colossus.description=塔架单位的延伸，从武器发射巨大激光，能控制雷击附近敌人的闪电光环球
unit.create-colossus.details=[gray]环绕周身的闪电球会主动雷击附近敌军，主巨激光扫过之处电弧蔓延。[]
unit.create-bastion.name=堡垒
unit.create-bastion.description=极其强大的多足地面单位，装备两对能量炮和一对重型连发炮，能控制雷击附近敌人的闪电光环球
unit.create-bastion.details=[gray]大量闪电球环绕周身雷击敌军，三组弹幕武器倾泻弹射弹，主炮可穿透多个目标并在飞行途中随机放出闪电。据说是巨石之王亲自设计的单位。[]
unit.create-adsect.name=扈从
unit.create-adsect.description=为协助核心单位而设计的简单支援单位，能维修核心、采矿和建造
unit.create-adsect.details=[gray]治疗激光弹命中友军即可回复其生命，还能采矿与建造，是巨石阵营最基础的勤务兵。[]
unit.create-comitate.name=侍从
unit.create-comitate.description=更强的辅助单位，能维修核心、采矿、建造和治疗附近友军
unit.create-comitate.details=[gray]治疗激光弹与双武器系统兼备，能维修核心、采矿、建造并治疗附近友军，是扈从的全面强化型。[]

